name: Build APK from Website Link
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Website link (https://...)"
        required: true
        default: "https://example.com"
      app_name:
        description: "App ka naam"
        required: true
        default: "My Web App"
      package_id:
        description: "Package ID (jaise com.mycompany.myapp)"
        required: true
        default: "com.webwrapper.app"
      theme_color:
        description: "Theme color hex (jaise #2563EB)"
        required: true
        default: "#2563EB"
      orientation:
        description: "Screen orientation"
        type: choice
        default: auto
        options: [auto, portrait, landscape]
      fullscreen:
        description: "Fullscreen"
        type: boolean
        default: false
      pull_to_refresh:
        description: "Pull to refresh"
        type: boolean
        default: true
      keep_screen_on:
        description: "Screen on rakho"
        type: boolean
        default: false
      desktop_mode:
        description: "Desktop mode default"
        type: boolean
        default: false
      external_in_browser:
        description: "Dusri websites ke links browser me kholo"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Apply settings
        env:
          SITE_URL: ${{ inputs.site_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          THEME_COLOR: ${{ inputs.theme_color }}
          ORIENTATION: ${{ inputs.orientation }}
          FULLSCREEN: ${{ inputs.fullscreen }}
          PULL_TO_REFRESH: ${{ inputs.pull_to_refresh }}
          KEEP_SCREEN_ON: ${{ inputs.keep_screen_on }}
          DESKTOP_MODE: ${{ inputs.desktop_mode }}
          EXTERNAL_IN_BROWSER: ${{ inputs.external_in_browser }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 .github/scripts/gen_config.py
      - name: Custom icon (optional, icon.png)
        run: |
          if [ -f icon.png ]; then
            command -v convert >/dev/null || sudo apt-get install -y imagemagick
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}
              mkdir -p app/src/main/res/mipmap-$n
              convert icon.png -resize ${s}x${s}^ -gravity center -extent ${s}x${s} app/src/main/res/mipmap-$n/ic_launcher.png
            done
            sed -i 's#@drawable/ic_launcher#@mipmap/ic_launcher#' app/src/main/AndroidManifest.xml
          fi
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
